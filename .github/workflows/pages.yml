# Builds the Rust core as WebAssembly and publishes editor/static on GitHub
# Pages. Tests run on every push; the tests that need Ricoh's firmware or
# photos skip here, since none of that is in the repository.
# Deploying needs Pages enabled with source "GitHub Actions"; while the
# repository is private the deploy job is skipped.
#
# Beta: the branch in BETA_BRANCH is published under /beta/ next to master.
# Only master may deploy (environment github-pages), so the site is always
# built from a master run, which also checks out the beta branch; a push to
# the beta branch runs its tests and then starts that master run. To start a
# beta, put its branch into BETA_BRANCH and into the push branches below.
name: Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BETA_BRANCH: ''   # empty: no beta

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Test core
        run: cargo test --release --manifest-path core/Cargo.toml
      - name: Build WebAssembly
        run: |
          wasm-pack build core --release --target web --out-dir ../editor/static/pkg --no-typescript --no-pack
          rm -f editor/static/pkg/.gitignore
          mkdir site && cp -r editor/static/. site/
      - name: Build the beta under /beta/
        if: github.ref == 'refs/heads/master' && env.BETA_BRANCH != ''
        run: |
          if git ls-remote --exit-code --heads origin "$BETA_BRANCH" > /dev/null; then
            git fetch --depth 1 origin "$BETA_BRANCH"
            git worktree add beta FETCH_HEAD
            wasm-pack build beta/core --release --target web --out-dir ../editor/static/pkg --no-typescript --no-pack
            rm -f beta/editor/static/pkg/.gitignore
            mkdir site/beta && cp -r beta/editor/static/. site/beta/
          else
            echo "no branch $BETA_BRANCH: no beta"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # a push to the beta branch (the only other push branch): after its tests,
  # rebuild the site from master
  beta:
    needs: build
    if: github.event_name == 'push' && github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run pages.yml --ref master --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
