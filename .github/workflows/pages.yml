# Builds the Rust core as WebAssembly and publishes editor/static on GitHub
# Pages. Tests run on every push; the tests that need Ricoh's firmware or
# photos skip here, since none of that is in the repository.
# Deploying needs Pages enabled with source "GitHub Actions"; while the
# repository is private the deploy job is skipped.
name: Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Test core
        run: cargo test --release --manifest-path core/Cargo.toml
      - name: Build WebAssembly
        run: |
          wasm-pack build core --release --target web --out-dir ../editor/static/pkg --no-typescript --no-pack
          rm -f editor/static/pkg/.gitignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: editor/static

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
